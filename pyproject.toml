[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "git-config-cli"
version = "0.1.0"
description = "A CLI tool that uses a Git repository as a versioned backend for configuration files."
requires-python = ">=3.11"
dependencies = [
    "GitPython>=3.1",
    "click>=8.1",
    "PyYAML>=6.0",
]

[project.scripts]
configctl = "configctl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["configctl"]
branch = true

[tool.coverage.report]
show_missing = true
